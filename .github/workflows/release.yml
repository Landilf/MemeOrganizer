name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-android-apk
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Resolve release version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            git fetch --tags --force
            latest_tag="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"

            if [[ -n "${latest_tag}" ]] && \
              [[ "$(git rev-list -n 1 "${latest_tag}")" == "$(git rev-parse HEAD)" ]] && \
              ! gh release view "${latest_tag}" >/dev/null 2>&1; then
              release_tag="${latest_tag}"
              create_tag=false
            elif [[ -z "${latest_tag}" ]]; then
              major=0
              minor=0
              patch=0
            elif [[ "${latest_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
            else
              echo "Unsupported release tag: ${latest_tag}" >&2
              exit 1
            fi

            if [[ -z "${release_tag:-}" ]]; then
              case "${RELEASE_TYPE}" in
                patch) patch=$((10#${patch} + 1)) ;;
                minor) minor=$((10#${minor} + 1)); patch=0 ;;
                major) major=$((10#${major} + 1)); minor=0; patch=0 ;;
                *) echo "Unsupported release type: ${RELEASE_TYPE}" >&2; exit 1 ;;
              esac

              release_tag="v${major}.${minor}.${patch}"
              create_tag=true
            fi
          else
            release_tag="${GITHUB_REF_NAME}"
            create_tag=false
          fi

          if [[ ! "${release_tag}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tags must use v<major>.<minor>.<patch>: ${release_tag}" >&2
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          version_name="${major}.${minor}.${patch}"
          version_code=$((10#${major} * 1000000 + 10#${minor} * 1000 + 10#${patch}))

          {
            echo "tag=${release_tag}"
            echo "name=${version_name}"
            echo "code=${version_code}"
            echo "create_tag=${create_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK platform
        run: |
          sdkmanager_path="$(find "${ANDROID_HOME}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -n "${sdkmanager_path}"
          "${sdkmanager_path}" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "${RELEASE_KEYSTORE_BASE64}"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/meme-organizer-release.jks"

      - name: Run unit tests and build signed APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/meme-organizer-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          -PreleaseVersionName=${{ steps.version.outputs.name }}
          -PreleaseVersionCode=${{ steps.version.outputs.code }}

      - name: Create release tag
        if: steps.version.outputs.create_tag == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" -m "Meme Organizer ${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

      - name: Prepare release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            "${RUNNER_TEMP}/MemeOrganizer.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${RUNNER_TEMP}/MemeOrganizer.apk" \
            --title "Meme Organizer ${{ steps.version.outputs.tag }}" \
            --generate-notes
